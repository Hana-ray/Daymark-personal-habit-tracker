spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/habits}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=4
spring.sql.init.mode=always
server.port=${PORT:3300}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

server.servlet.session.cookie.name=DAYMARK_SESSION
